name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install black ruff
      - run: ruff check .
      - run: black --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Start Oracle
        run: docker compose up -d --wait

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e ".[test]"

      - name: Install Oracle Instant Client
        run: |
          sudo apt-get update
          sudo apt-get install -y libaio1t64 unzip
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
          curl -sSLo instantclient.zip https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip
          unzip -q instantclient.zip -d "$HOME/oracle"
          client_dir="$(echo "$HOME"/oracle/instantclient_*)"
          echo "$client_dir" | sudo tee /etc/ld.so.conf.d/oracle-instantclient.conf
          sudo ldconfig
          echo "ORACLE_CLIENT_DIR=$client_dir" >> "$GITHUB_ENV"

      - name: Wait for test user
        run: |
          for attempt in $(seq 1 60); do
            python -c "import oracledb; oracledb.connect(user='test_user', password='test_password', dsn='localhost:1521/FREEPDB1')" && exit 0
            sleep 5
          done
          exit 1

      - name: Configure tests
        run: |
          cat > tests/database.ini <<EOF
          [database]
          user = test_user
          password = test_password
          host = localhost
          port = 1521
          service_name = FREEPDB1
          oracle_client_dir = $ORACLE_CLIENT_DIR
          EOF

      - run: pytest
